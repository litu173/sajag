name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', 'brand/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Build portal (/) and admin (/admin/)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Leave these secrets unset to publish the demo; set them to go live.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Assemble site
        run: |
          mkdir -p ../site
          cp -r portal/dist/. ../site/
          cp -r admin/dist ../site/admin
          touch ../site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
