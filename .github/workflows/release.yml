name: Release installers

# Push a tag like v1.0.1 to build an Android APK and an unsigned iOS IPA and attach them to a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.6', channel: stable, cache: true }
      - run: flutter pub get
      - name: Universal APK (any phone) and a smaller arm64 APK (most phones from 2017 on)
        env:
          DEFINES: >-
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release $DEFINES
          mv build/app/outputs/flutter-apk/app-release.apk ../sajag-android-universal.apk
          flutter build apk --release --split-per-abi $DEFINES
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../sajag-android-arm64.apk
      - uses: actions/upload-artifact@v7
        with: { name: android, path: 'sajag-android-*.apk' }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.6', channel: stable, cache: true }
      - run: flutter pub get
      - run: >-
          flutter build ios --release --no-codesign
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Package unsigned IPA (sign it with your Apple ID, e.g. via Sideloadly or Xcode)
        run: |
          mkdir -p Payload && cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr ../sajag-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with: { name: ios, path: sajag-ios-unsigned.ipa }

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            sajag-android-universal.apk
            sajag-android-arm64.apk
            sajag-ios-unsigned.ipa
          generate_release_notes: true
