name: sajag
description: "Sajag — report civic issues, anonymously."
publish_to: "none"

version: 1.6.0+7

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  supabase_flutter: ^2.18.2
  camera: ^0.12.1
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  cached_network_image: ^4.0.4
  flutter_image_compress: ^2.5.1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  share_plus: ^13.3.1
  flutter_svg: ^2.3.0
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/brand/
  # Anek Bangla (SIL Open Font License, see assets/fonts/OFL.txt) covers Bangla and Latin.
  fonts:
    - family: AnekBangla
      fonts:
        - asset: assets/fonts/AnekBangla-400.ttf
          weight: 400
        - asset: assets/fonts/AnekBangla-500.ttf
          weight: 500
        - asset: assets/fonts/AnekBangla-600.ttf
          weight: 600
        - asset: assets/fonts/AnekBangla-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../brand/icon-square-1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B7A57"
  adaptive_icon_foreground: "../brand/icon-foreground-1024.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#0B7A57"
  image: "../brand/icon-foreground-1024.png"
  android_12:
    color: "#0B7A57"
    image: "../brand/icon-foreground-1024.png"
