<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sajag — সজাগ</title>
    <meta name="description" content="সজাগ: নাগরিকদের রিপোর্ট করা রাস্তার সমস্যা — খোলা ম্যানহোল, ভাঙা রাস্তা, ময়লা, জলাবদ্ধতা। Citizen reports of civic problems across Bangladesh." />
    <meta name="theme-color" content="#0b7a57" />
    <meta property="og:title" content="Sajag — সজাগ" />
    <meta property="og:description" content="See it. Snap it. Fix it. Citizen reports of civic problems, anonymously." />
    <meta property="og:image" content="icon-512.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Anek+Bangla:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <script>
      // Apply a saved theme before the first paint so there's no flash of the wrong palette.
      try { var t = localStorage.getItem('sajag.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <style>
      /* Splash: painted before any JavaScript runs; the app fades it out after the logo animation. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden; cursor: pointer;
        background: radial-gradient(120% 90% at 50% 18%, #19a379 0%, #0b7a57 45%, #063f2d 100%); color: #fff;
        font-family: 'Anek Bangla', system-ui, sans-serif; text-align: center;
        transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1); }
      #splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .sp-mark { position: relative; width: 120px; height: 120px; margin: 0 auto 26px; }
      #splash .sp-mark img { position: relative; width: 120px; height: 120px; border-radius: 30px;
        box-shadow: 0 24px 60px -12px rgba(0,0,0,.45); animation: sp-drop .9s cubic-bezier(.34,1.56,.64,1) both, sp-float 2.6s ease-in-out 1.1s infinite; }
      #splash .sp-ring { position: absolute; inset: 0; border-radius: 34px; border: 2px solid rgba(255,255,255,.55);
        opacity: 0; animation: sp-ripple 2.4s cubic-bezier(.22,1,.36,1) .8s infinite; }
      #splash .sp-ring.r2 { animation-delay: 1.6s; }
      #splash .sp-ring.r3 { animation-delay: 2.4s; }
      #splash .sp-name { display: flex; gap: 12px; justify-content: center; align-items: baseline; font-size: 40px; font-weight: 700; line-height: 1.2; }
      #splash .sp-name > * { animation: sp-rise .8s cubic-bezier(.22,1,.36,1) both; }
      #splash .sp-name > :nth-child(1) { animation-delay: .75s; }
      #splash .sp-name > :nth-child(2) { animation-delay: .9s; opacity: .5; font-style: normal; }
      #splash .sp-name > :nth-child(3) { animation-delay: 1.05s; font-family: 'Fraunces', Georgia, serif; font-weight: 600; }
      #splash .sp-tag { display: block; margin-top: 8px; font-size: 17px; opacity: 0; animation: sp-fade .9s ease 1.45s forwards; }
      #splash .sp-bar { position: absolute; left: 50%; bottom: calc(48px + env(safe-area-inset-bottom)); width: 160px; height: 3px;
        margin-left: -80px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
      #splash .sp-bar i { display: block; height: 100%; width: 100%; border-radius: inherit; background: #f0cf95;
        transform-origin: left; animation: sp-load 3.3s cubic-bezier(.4,.1,.2,1) .2s both; }
      @keyframes sp-drop { from { opacity: 0; transform: translateY(-36px) scale(.55) rotate(-8deg); } }
      @keyframes sp-float { 50% { transform: translateY(-6px); } }
      @keyframes sp-ripple { 0% { opacity: .7; transform: scale(.9); } 100% { opacity: 0; transform: scale(2.1); } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(14px); } }
      @keyframes sp-fade { to { opacity: .85; } }
      @keyframes sp-load { from { transform: scaleX(0); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash .sp-mark img { animation: none !important; opacity: 1 !important; }
        #splash .sp-tag { opacity: .85 !important; }
        #splash .sp-ring { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Sajag">
      <div>
        <div class="sp-mark" aria-hidden="true">
          <span class="sp-ring"></span><span class="sp-ring r2"></span><span class="sp-ring r3"></span>
          <img src="logo.svg" alt="" />
        </div>
        <strong class="sp-name"><span>সজাগ</span><i>·</i><span>Sajag</span></strong>
        <span class="sp-tag">দেখুন। ছবি তুলুন। সমাধান করুন।</span>
      </div>
      <div class="sp-bar" aria-hidden="true"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
